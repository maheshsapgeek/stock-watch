name: Publish to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # 08:00 Amsterdam on weekdays: refresh positions from Trading 212 before the daily brief
    - cron: "0 6 * * 1-5"
    # Hourly through the US session (13:30-21:30 UTC covers summer and winter time): losers list + positions
    - cron: "30 13-21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write   # the job force-pushes the latest public data snapshot to the "data" branch
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html manifest.webmanifest icon-180.png icon-192.png icon-512.png site/
      - name: Fetch Trading 212 positions (encrypted)
        continue-on-error: true
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY || secrets.T212KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET || secrets.T212SECRET }}
          APP_PASSPHRASE: ${{ secrets.APP_PASSPHRASE || secrets.APPPASS }}
        run: |
          pip install -q cryptography
          python sync/fetch_positions.py
      - name: Build biggest-losers list (S&P 500 + Nasdaq-100, with fundamentals)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          pip install -q "yfinance>=0.2.60" pandas lxml requests
          python sync/losers.py
      - name: Publish public data snapshot to the "data" branch (losers + universe only; nothing personal)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/snap && mkdir -p /tmp/snap
          cp site/data/losers.json /tmp/snap/ 2>/dev/null || echo '{"ok":false,"reason":"not built"}' > /tmp/snap/losers.json
          cp site/data/universe.json /tmp/snap/ 2>/dev/null || true
          cd /tmp/snap && git init -q && git checkout -q -b data && git add -A
          git -c user.name="stock-watch-bot" -c user.email="bot@users.noreply.github.com" commit -qm "snapshot $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
